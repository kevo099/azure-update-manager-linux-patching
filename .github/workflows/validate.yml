name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compile Bicep templates
        run: |
          az bicep build --file infra/linux-patch-rings.bicep --stdout > /dev/null
          az bicep build --file infra/patch-alerts.bicep --stdout > /dev/null

      - name: Parse runbooks
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem runbooks -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$($f.Name): $($_.Message)" }; $failed = $true }
          }
          if ($failed) { throw 'runbook parse errors' }

      - name: PSScriptAnalyzer (errors fail the build)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          $findings = Invoke-ScriptAnalyzer -Path ./runbooks -Severity Error
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if (@($findings).Count -gt 0) { throw "PSScriptAnalyzer reported $(@($findings).Count) error(s)." }

      - name: Shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh

      - name: Queries carry the resource-group placeholder
        run: |
          for f in queries/*.kql; do grep -q '{RESOURCE_GROUP}' "$f" || { echo "$f lacks {RESOURCE_GROUP}"; exit 1; }; done

      - name: Public-content privacy check
        run: python3 scripts/check_public_content.py
